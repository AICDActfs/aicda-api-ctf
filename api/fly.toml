app = 'aicda-api'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[[services]]
  http_checks = []
  internal_port = 8080
  processes = ['app']
  protocol = 'tcp'

  [[services.ports]]
    force_https = true
    handlers = ['http']
    port = 80

  [[services.ports]]
    handlers = ['tls', 'http']
    port = 443
